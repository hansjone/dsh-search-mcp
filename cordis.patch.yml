# dsh-search-mcp bundle layer (Desktop 0.2 boot-safe).
#
# IMPORTANT: Do NOT set `web.searchProvider: search-mcp` or disable
# `web-search-deepseek` in this patch. On Desktop 0.2 that creates a
# load-order deadlock (web waits for search-mcp, search-mcp waits for web)
# and freezes the UI on "Loading plugins…".
#
# The host `apply` registers the provider and then live-pins
# `ctx.web.searchProviderId = search-mcp` (no settings mutate / no patch pin).
# Removing this package restores the previous composition.

- insert:
    - id: search-mcp
      name: 'dsh-search-mcp'
      config:
        defaultServer: bailian
        maxResults: 8
        searchTimeoutMs: 30000
        servers:
          - id: bailian
            kind: bailian
            apiKeyEnv: DASHSCOPE_API_KEY

# Raise tool-web caps so search-mcp maxResults can take effect.
- id: tool-web
  disabled: false
  config:
    fetch: false
    searchTimeoutMs: 60000
    searchMaxResults: 50
    searchMaxQueries: 4
